<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>   
    <style>
        /* Same styling as your Login/Signup pages */
        /* Navbar styling */
        .navbar {
            background-color: #7b47ff; /* Violet theme color */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .navbar .nav-links {
            display: flex;
        }


        .container {
            width: 400px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: #000;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        ul li {
            background-color: #e0e0e0;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        form {
            display: flex;
            margin-top: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #7a57d1;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6840b0;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="nav-links">
            <a href="{% url 'home-page' %}">Home</a>
            <a href="{% url 'to-do_api' %}">To Do</a>
        </div>
    </div>

    <div class="container">
        <h1>To-Do List</h1>
        <ul>
            {% for task in tasks %}
                <li>{{ task.title }} 
                    <form action="{% url 'delete_task' task.id %}" method="POST" style="display:inline;">
                        {% csrf_token %} 
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
        <form action="{% url 'to-do_api' %}" method="POST">
            {% csrf_token %}
            <input type="text" name="task" placeholder="Add a new task" required>
            <button type="submit">Add</button>
        </form>
    </div>
</body>
</html>
