<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        /* General styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background-color: #7c3aed; /* Violet background */
            color: white;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .navbar ul li {
            display: inline;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
        }

        .navbar ul li a:hover {
            text-decoration: underline;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
            background-color: #e6e1f5; /* Light violet background */
            color: #4a4a4a;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #666;
        }

        .hero a {
            background-color: #7c3aed;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .hero a:hover {
            background-color: #5e2bbf;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            background-color: #7c3aed; /* Violet background */
            color: white;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <h1>TheClub</h1>
        <ul>
            <li><a id="home-page" href="/accounts/home/">Home</a></li>
            <li><a href="/contact/">Contact Us</a></li>
            <li><a href="/accounts/to-do/">To-Do</a></li>
        </ul>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome to TheClub</h1>
        <p>Explore our tools and resources to make your life easier!</p>
        <a href="/contact/">Get Started</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2025 TheCubeFactory. All Rights Reserved.
    </div>
</body>
</html>
